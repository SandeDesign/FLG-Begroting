<!doctype html>
<html lang="nl" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FLG-Begroting</title>
    <meta
      name="description"
      content="Begrotingen voor de entiteiten van de groep: opbrengsten uit opdrachten, directe kosten, vaste lasten en het ketenoverzicht."
    />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#cd853f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FLG-Begroting" />
    <link rel="apple-touch-icon" href="/Logo.png" />
  </head>
  <body class="h-full bg-gray-50">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service worker registreren; de app vraagt zelf om te vernieuwen -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker
          .register('/service-worker.js')
          .then(function (reg) {
            reg.addEventListener('updatefound', function () {
              var nieuweWorker = reg.installing;
              if (!nieuweWorker) return;
              nieuweWorker.addEventListener('statechange', function () {
                if (nieuweWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  window.dispatchEvent(
                    new CustomEvent('swUpdateAvailable', { detail: { reg: reg } })
                  );
                }
              });
            });
          })
          .catch(function (fout) {
            console.error('Service worker registreren mislukt:', fout);
          });
      }
    </script>
  </body>
</html>
